name: Spring Boot Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    working-directory: java/spring-boot-challenge

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start DBA challenge services
        working-directory: dba-challenge
        run: docker compose up -d

      - name: Make Rails scripts executable
        working-directory: ruby-on-rails
        run: chmod +x bin/*

      - name: Start Ruby on Rails services
        working-directory: ruby-on-rails
        run: docker compose up -d

      - name: Prepare Rails test database
        working-directory: ruby-on-rails
        run: docker compose run --rm web bin/rails db:prepare

      - name: Run Rails RSpec tests
        working-directory: ruby-on-rails
        run: docker compose run --rm web bundle exec rspec

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/spring-boot-challenge/pom.xml

      - name: Run Maven tests
        run: mvn --batch-mode test

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean package
